<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mywalnut — 05 Grove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Petrona:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* ============ GROVE — the walnut tree, alive ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F5F1E6;
  --paper:#FBF7EB;
  --paper-2:#F0E9D6;
  --ink:#2D261D;
  --bark:#5B4632;
  --bark-soft:#80694F;
  --leaf:#3E6B34;
  --leaf-deep:#2C4F25;
  --spring:#7FA86B;
  --spring-tint:#E8EDD8;
  --bark-tint:#EFE3CC;
  --sun:#E9B83C;
  --sun-ink:#4A3A14;
  --hairline:rgba(62,107,52,.20);
  --hairline-bark:rgba(91,70,50,.18);
  --ui:'Bricolage Grotesque',sans-serif;
  --prose:'Petrona',Georgia,serif;
}
html,body{height:100%}
body{
  font-family:var(--ui);
  color:var(--ink);
  background-color:var(--cream);
  background-image:
    radial-gradient(1100px 700px at 88% -8%, rgba(233,184,60,.09), transparent 62%),
    radial-gradient(950px 640px at -8% 18%, rgba(127,168,107,.10), transparent 58%),
    radial-gradient(800px 600px at 50% 110%, rgba(127,168,107,.07), transparent 55%);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* paper grain */
body::after{
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.31 0 0 0 0 0.20 0 0 0 0.035 0"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');
}
/* huge soft leaf shadows — morning light through a canopy */
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.atmos svg{position:absolute;color:var(--spring);filter:blur(46px)}
.atmos .ls1{width:560px;height:560px;top:-130px;left:-110px;opacity:.07;transform:rotate(18deg)}
.atmos .ls2{width:640px;height:640px;bottom:-220px;right:-160px;opacity:.06;transform:rotate(-156deg)}
.atmos .ls3{width:380px;height:380px;top:30%;right:6%;opacity:.045;transform:rotate(64deg)}

/* ============ DEMO BAR (neutral chrome) ============ */
.demobar{
  position:fixed;top:0;left:0;right:0;height:46px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:#211E17;color:#EFEAD9;border-bottom:1px solid rgba(0,0,0,.35);
}
.demobar .dname{font:600 12px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#CFC8B1}
.shell-toggle{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:9px}
.shell-toggle button{
  appearance:none;border:0;background:transparent;color:#D8D2BD;
  font:600 12px/1 var(--ui);letter-spacing:.04em;padding:7px 15px;border-radius:7px;cursor:pointer;
  transition:background .15s,color .15s;
}
.shell-toggle button:hover{color:#fff}
.shell-toggle button[aria-pressed="true"]{background:#F5F1E6;color:#2A2519}

/* ============ STAGE + SHELLS ============ */
.stage{position:relative;z-index:2;padding-top:46px;height:100vh}
.shell-desktop{display:flex;height:calc(100vh - 46px)}
.shell-phone{height:calc(100vh - 46px);display:none;align-items:center;justify-content:center;padding:18px}
.stage[data-shell="phone"] .shell-desktop{display:none}
.stage[data-shell="phone"] .shell-phone{display:flex}

/* view switching (both shells) */
.view{display:none}
.js-shell[data-view="session"] .view-session{display:flex;flex-direction:column;height:100%;min-height:0}
.js-shell[data-view="manual"] .view-manual{display:block;height:100%;min-height:0;overflow-y:auto}

/* ============ SIDEBAR ============ */
.sidebar{
  width:274px;flex:0 0 274px;display:flex;flex-direction:column;
  padding:28px 18px 20px;border-right:1px solid var(--hairline);
  background:linear-gradient(180deg, rgba(127,168,107,.07), rgba(127,168,107,0) 34%);
}
.brand{display:flex;align-items:center;gap:13px;padding:2px 8px 20px}
.brand .brand-mark{width:46px;height:46px;color:var(--leaf);flex:0 0 auto}
.brand .wm{font:600 21px/1.1 var(--ui);letter-spacing:-.015em;color:var(--bark)}
.brand .wm em{font-style:normal;font-weight:700;color:var(--leaf-deep)}
.brand .tagline{font:600 12px/1 var(--ui);letter-spacing:.13em;text-transform:uppercase;color:var(--leaf);margin-top:5px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:14px}
.nav button{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 13px;border:0;background:transparent;border-radius:11px;cursor:pointer;text-align:left;
  font:500 15px/1 var(--ui);color:var(--bark);transition:background .16s,color .16s;
}
.nav button svg{width:19px;height:19px;flex:0 0 auto;color:var(--bark-soft);transition:color .16s}
.nav button:hover{background:rgba(127,168,107,.15);color:var(--leaf-deep)}
.nav button:hover svg{color:var(--leaf)}
.nav button[aria-current="true"]{background:rgba(127,168,107,.20);color:var(--leaf-deep);font-weight:650}
.nav button[aria-current="true"] svg{color:var(--leaf)}
.nav button[aria-current="true"]::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--leaf);
}
.nav .soon-tag{margin-left:auto;font:600 12px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--bark-soft);opacity:.7}
.side-foot{margin-top:auto;padding:0 8px}
.side-foot .note{font:500 12px/1.5 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--bark-soft)}

/* botanical divider */
.divider{display:flex;align-items:center;gap:10px;color:rgba(62,107,52,.55);margin:2px 0 10px}
.divider::before,.divider::after{content:"";flex:1;height:1px}
.divider::before{background:linear-gradient(90deg,transparent,rgba(62,107,52,.32))}
.divider::after{background:linear-gradient(90deg,rgba(62,107,52,.32),transparent)}
.divider svg{width:13px;height:13px;flex:0 0 auto}

/* ============ DESKTOP MAIN ============ */
.main{flex:1;min-width:0;height:100%;display:flex;justify-content:center}
.col{width:100%;max-width:720px;height:100%;min-height:0;padding:0 10px}

/* ============ PHONE FRAME ============ */
.phone{
  width:430px;max-width:100%;height:min(860px,100%);
  background:#2B241A;border-radius:48px;padding:11px;
  box-shadow:0 36px 90px -34px rgba(43,38,28,.5),0 6px 20px rgba(43,38,28,.18);
}
.screen{
  height:100%;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative;
  background-color:var(--cream);
  background-image:
    radial-gradient(420px 320px at 92% -4%, rgba(233,184,60,.10), transparent 62%),
    radial-gradient(380px 300px at -6% 16%, rgba(127,168,107,.11), transparent 58%);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 11px;border-bottom:1px solid var(--hairline);position:relative;z-index:20;
}
.brand-sm{display:flex;align-items:center;gap:9px}
.brand-sm svg{width:30px;height:30px;color:var(--leaf)}
.brand-sm .wm{font:600 17px/1 var(--ui);letter-spacing:-.01em;color:var(--bark)}
.brand-sm .wm em{font-style:normal;font-weight:700;color:var(--leaf-deep)}
.menu-btn{
  display:flex;align-items:center;gap:7px;border:1px solid var(--hairline-bark);
  background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;
  font:600 12px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--bark);
  transition:background .15s,border-color .15s;
}
.menu-btn svg{width:15px;height:15px;color:var(--leaf)}
.menu-btn:hover{background:var(--spring-tint);border-color:var(--hairline)}
.menu-pop{
  position:absolute;top:calc(100% + 6px);right:14px;z-index:40;min-width:182px;
  background:var(--paper);border:1px solid var(--hairline);border-radius:14px;padding:6px;
  box-shadow:0 18px 44px -18px rgba(45,56,35,.4);
}
.menu-pop .nav{margin-top:0;gap:2px}
.menu-pop .nav button{padding:10px 12px}
/* ============ CHAT ============ */
.chat-stream{
  flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  padding:26px 22px 16px;scroll-behavior:smooth;
}
.session-eyebrow{
  align-self:center;font:600 12px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;
  color:var(--bark-soft);margin-bottom:6px;
}
.chat-stream .divider{align-self:stretch;margin:0 36px 22px}
.msg{max-width:84%;margin-bottom:15px;display:flex;flex-direction:column;gap:5px}
.msg--jove{align-self:flex-start}
.msg--user{align-self:flex-end;align-items:flex-end}
.msg .who{
  display:flex;align-items:center;gap:5px;padding-left:4px;
  font:650 12px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);
}
.msg .who svg{width:11px;height:11px}
.vessel{
  padding:13px 17px;font:400 15.5px/1.62 var(--prose);color:var(--ink);
  border:1px solid transparent;
}
.msg--jove .vessel{
  background:var(--spring-tint);border-color:rgba(62,107,52,.16);
  border-radius:4px 20px 20px 17px;
  box-shadow:0 2px 10px -6px rgba(62,107,52,.35);
}
.msg--user .vessel{
  background:var(--bark-tint);border-color:rgba(91,70,50,.20);
  border-radius:20px 4px 17px 20px;
  box-shadow:0 2px 10px -6px rgba(91,70,50,.3);
}
/* typing — three seeds */
.vessel.typing{display:inline-flex;align-items:center;gap:6px;padding:16px 18px;min-height:0}
.seed{width:7px;height:10px;background:var(--spring);border-radius:50% 50% 46% 54%/62% 62% 38% 38%;animation:seedbob 1.1s ease-in-out infinite}
.seed:nth-child(2){animation-delay:.16s}
.seed:nth-child(3){animation-delay:.32s}
@keyframes seedbob{0%,100%{transform:translateY(0) rotate(-5deg);opacity:.55}50%{transform:translateY(-4px) rotate(5deg);opacity:1}}

/* input bar */
.inputbar{padding:12px 18px 18px;border-top:1px solid var(--hairline)}
.chatform{
  display:flex;align-items:center;gap:10px;background:var(--paper);
  border:1px solid var(--hairline-bark);border-radius:8px 18px 18px 16px;padding:6px 6px 6px 17px;
  transition:border-color .18s,box-shadow .18s;
}
.chatform:focus-within{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(127,168,107,.25)}
.chatform input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font:400 15px/1.4 var(--prose);color:var(--ink);
}
.chatform input::placeholder{color:#8E7A60;font-style:italic}
.send{
  width:40px;height:40px;flex:0 0 auto;border:0;border-radius:7px 14px 14px 12px;cursor:pointer;
  background:var(--leaf);color:#F7F3E5;display:grid;place-items:center;
  transition:background .15s,transform .15s;
}
.send svg{width:18px;height:18px}
.send:hover{background:var(--leaf-deep);transform:translateY(-1px)}
.send:active{transform:translateY(0)}

/* ============ CHECKPOINT — the specimen card ============ */
.checkpoint{
  position:relative;margin:4px 0 18px;width:100%;
  background:var(--paper);border:1px solid rgba(62,107,52,.38);border-radius:15px;
  outline:1px solid rgba(62,107,52,.18);outline-offset:-6px;
  padding:20px 22px 20px;
  box-shadow:0 24px 50px -28px rgba(56,74,44,.45),0 2px 8px -4px rgba(56,74,44,.18);
  transition:border-color .5s,outline-color .5s;
}
.cp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cp-badge{
  display:inline-flex;align-items:center;gap:7px;
  font:700 12px/1 var(--ui);letter-spacing:.15em;text-transform:uppercase;color:var(--leaf-deep);
}
.cp-badge svg{width:17px;height:19px;color:var(--leaf)}
.cp-no{font:500 12px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--bark-soft)}
.cp-eyebrow{font:650 12.5px/1 var(--ui);letter-spacing:.15em;text-transform:uppercase;color:var(--leaf);margin-bottom:9px}
.cp-headline{font:italic 600 21.5px/1.3 var(--prose);color:var(--ink);letter-spacing:.002em;margin-bottom:13px}
.cp-rule{height:1px;background:linear-gradient(90deg,rgba(62,107,52,.34),rgba(62,107,52,.06));margin-bottom:13px}
.cp-body{font:400 15px/1.7 var(--prose);color:var(--bark)}
.cp-actions{display:flex;align-items:center;gap:9px;margin-top:18px;flex-wrap:wrap}
.btn{
  appearance:none;cursor:pointer;font:600 14px/1 var(--ui);letter-spacing:.015em;
  padding:11px 18px;border-radius:8px 13px 13px 11px;border:1px solid transparent;
  transition:background .15s,transform .15s,border-color .15s,box-shadow .15s;
}
.btn-primary{
  background:var(--leaf);color:#F7F3E5;
  box-shadow:0 8px 18px -10px rgba(44,79,37,.7);
}
.btn-primary:hover{background:var(--leaf-deep);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}
.btn-ghost{background:transparent;color:var(--bark);border-color:var(--hairline-bark)}
.btn-ghost:hover{background:rgba(127,168,107,.12);border-color:var(--hairline);color:var(--leaf-deep)}
.btn-ghost:disabled{opacity:.45;cursor:default}
/* planting */
.cp-plantwrap{display:none}
.checkpoint.is-planting .cp-actions{display:none}
.checkpoint.is-planting .cp-plantwrap{display:flex;flex-direction:column;align-items:center;gap:11px;padding:10px 0 2px;margin-top:14px}
.cp-sprout{width:46px;height:54px;color:var(--leaf)}
.cp-sprout path{
  fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;
}
.is-planting .cp-sprout .d1{animation:draw .28s ease-out forwards}
.is-planting .cp-sprout .d2{animation:draw .34s ease-out .22s forwards}
.is-planting .cp-sprout .d3{animation:draw .4s ease-out .5s forwards}
.is-planting .cp-sprout .d4{animation:draw .4s ease-out .68s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.checkpoint.is-planted{border-color:rgba(233,184,60,.65);outline-color:rgba(233,184,60,.35)}
.cp-plantwrap .tag-sun{opacity:0;transform:translateY(4px);transition:opacity .4s ease,transform .4s ease}
.checkpoint.is-planted .cp-plantwrap .tag-sun{opacity:1;transform:none}
.tag-sun{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--sun);color:var(--sun-ink);
  font:700 12px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;
}
.tag-sun svg{width:12px;height:12px}

/* ============ MANUAL — the herbarium ============ */
.view-manual{padding:30px 22px 64px}
.manual-head{text-align:left;margin-bottom:8px}
.manual-title{font:650 28px/1.15 var(--ui);letter-spacing:-.02em;color:var(--ink)}
.manual-sub{font:600 12.5px/1 var(--ui);letter-spacing:.15em;text-transform:uppercase;color:var(--leaf);margin-top:8px}
.view-manual .divider{margin:18px 0 22px}
.bed{
  background:var(--paper);border:1px solid var(--hairline-bark);border-radius:17px;
  margin-bottom:15px;overflow:hidden;
  box-shadow:0 14px 30px -24px rgba(56,74,44,.35);
  animation:rise .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0)*70ms);
}
.bed-head{
  display:flex;align-items:center;gap:13px;padding:15px 18px;
  border-bottom:1px solid var(--hairline);
  background:linear-gradient(180deg, rgba(127,168,107,.10), rgba(127,168,107,0));
}
.bed-glyph{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px 12px 12px 11px;
  background:rgba(127,168,107,.18);color:var(--leaf-deep);display:grid;place-items:center;
}
.bed-glyph svg{width:20px;height:20px}
.bed-num{display:block;font:italic 500 12.5px/1 var(--prose);color:var(--bark-soft);margin-bottom:4px}
.bed-name{font:650 16.5px/1.1 var(--ui);letter-spacing:-.01em;color:var(--ink)}
.bed-count{margin-left:auto;font:600 12px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--bark-soft);white-space:nowrap}
.entry + .entry{border-top:1px solid var(--hairline)}
.entry-toggle{
  width:100%;display:flex;align-items:center;gap:10px;padding:14px 18px;
  background:transparent;border:0;cursor:pointer;text-align:left;
  transition:background .15s;
}
.entry-toggle:hover{background:rgba(127,168,107,.09)}
.entry-star{color:#B98A18;font-size:13px;line-height:1;flex:0 0 auto}
.entry-title{font:italic 600 16px/1.4 var(--prose);color:var(--ink)}
.entry-chev{margin-left:auto;flex:0 0 auto;width:16px;height:16px;color:var(--bark-soft);transition:transform .22s ease}
.entry.open .entry-chev{transform:rotate(180deg)}
.entry-body{display:none;padding:0 18px 18px;font:400 15px/1.72 var(--prose);color:var(--bark)}
.entry.open .entry-body{display:block}
.bed-empty{padding:15px 18px;font:italic 400 14px/1.6 var(--prose);color:var(--bark-soft)}
.tag-new{
  display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  background:var(--sun);color:var(--sun-ink);
  font:700 12px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;
}
.tag-new svg{width:11px;height:11px}
.entry.is-new{background:linear-gradient(180deg, rgba(233,184,60,.10), rgba(233,184,60,0) 70%)}

/* ============ MOTION + FOCUS ============ */
@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
.msg,.checkpoint,.session-eyebrow,.chat-stream .divider{
  animation:rise .55s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0)*95ms);
}
.msg-in{animation:rise .45s cubic-bezier(.2,.7,.3,1) both;animation-delay:0ms}
.brand,.nav,.side-foot{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
.nav{animation-delay:90ms}.side-foot{animation-delay:160ms}
:focus-visible{outline:2px solid var(--leaf-deep);outline-offset:2px}
.shell-toggle button:focus-visible{outline-color:#F5F1E6}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .chat-stream{scroll-behavior:auto}
  .cp-sprout path{stroke-dashoffset:0}
}
@media (max-width:900px){
  .sidebar{width:218px;flex-basis:218px}
}
</style>
</head>

    </symbol>
    <symbol id="g-leaf-tiny" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 13.5C2.5 7 7 2.8 13.5 2.5 13.2 9 9 13.3 2.5 13.5Z"/>

<!-- ============ SESSION TEMPLATE ============ -->
<template id="tpl-session">
  <div class="chat-stream">
    <div class="session-eyebrow" style="--i:0">Wednesday · Evening session</div>
    <div class="divider" aria-hidden="true" style="--i:0"><svg><use href="#g-leaf-tiny"/></svg></div>

    <div class="msg msg--user" style="--i:1">
      <div class="vessel">I told my manager I&rsquo;d have the deck done by Friday. It&rsquo;s Wednesday night and I haven&rsquo;t opened the file. I keep doing this.</div>
    </div>

    <div class="msg msg--jove" style="--i:2">
      <span class="who"><svg aria-hidden="true"><use href="#g-leaf-tiny"/></svg>Jove</span>
      <div class="vessel">Which part keeps happening. The not opening it, or the promising Friday in the first place? Walk me through the moment you said Friday.</div>
    </div>

    <div class="msg msg--user" style="--i:3">
      <div class="vessel">She asked when I could have it and Friday just came out. It felt generous at the time. Like plenty of room.</div>
    </div>

    <div class="msg msg--jove" style="--i:4">
      <span class="who"><svg aria-hidden="true"><use href="#g-leaf-tiny"/></svg>Jove</span>
      <div class="vessel">Plenty of room for the version of you in that meeting. He wasn&rsquo;t the one who had to open the file. What does Wednesday-night you know that meeting you didn&rsquo;t?</div>
    </div>

    <div class="msg msg--user" style="--i:5">
      <div class="vessel">That it isn&rsquo;t real yet. A deadline isn&rsquo;t real until it&rsquo;s close enough to touch. Then the panic kicks in, and honestly the panic works. The deck will be good. It&rsquo;s always good.</div>
    </div>

    <div class="msg msg--jove" style="--i:6">
      <span class="who"><svg aria-hidden="true"><use href="#g-leaf-tiny"/></svg>Jove</span>
      <div class="vessel">So the system delivers. The deck is always good. The cost isn&rsquo;t the quality. It&rsquo;s the days of dread you pay before the panic shows up to do the work. I think there&rsquo;s a piece of your Manual in this. Want to see it?</div>
    </div>

    <div class="msg msg--user" style="--i:7">
      <div class="vessel">ok show me</div>
    </div>

    <article class="checkpoint" style="--i:8" aria-label="Checkpoint — a proposed entry for your Manual">
      <div class="cp-top">
        <span class="cp-badge"><svg aria-hidden="true"><use href="#g-sprout"/></svg>Checkpoint</span>
        <span class="cp-no">For your Manual</span>
      </div>
      <div class="cp-eyebrow">Layer III · How I Process Things</div>
      <h3 class="cp-headline">Deadlines aren&rsquo;t real until I can touch them</h3>
      <div class="cp-rule" aria-hidden="true"></div>
      <p class="cp-body">You commit to dates in a different timezone than the one you work in. In the meeting, Friday feels like plenty of room, so you say it freely. The date doesn&rsquo;t turn real until it&rsquo;s close enough to touch. Then the panic switches on, and the panic is the engine. It works. The deck is always good. What it costs is the stretch in between. The dread, the unopened file, the loop of telling yourself to start. The work was never the problem. The waiting room is.</p>
      <div class="cp-actions">
        <button type="button" class="btn btn-primary js-confirm">Add to Manual</button>
        <button type="button" class="btn btn-ghost">Edit</button>
        <button type="button" class="btn btn-ghost">Not quite</button>
      </div>
      <div class="cp-plantwrap">
        <svg class="cp-sprout" viewBox="0 0 48 56" aria-hidden="true">
          <path class="d1" pathLength="1" d="M14 52h20"/>
          <path class="d2" pathLength="1" d="M24 52c0-8 0-19 0-28"/>
          <path class="d3" pathLength="1" d="M24 31c-6-1-11-5-12.5-11.5 7 .5 11.5 5 12.5 11.5Z"/>
          <path class="d4" pathLength="1" d="M24 24c6-1 11-5 12.5-11.5-7 .5-11.5 5-12.5 11.5Z"/>
        </svg>
        <span class="tag-sun"><svg aria-hidden="true"><use href="#g-leaf-tiny"/></svg>Planted · Layer III</span>
      </div>
    </article>
  </div>

  <div class="inputbar">
    <form class="chatform">
      <input type="text" aria-label="Message Jove" placeholder="Say it how it actually happened" autocomplete="off">
      <button type="submit" class="send" aria-label="Send"><svg aria-hidden="true"><use href="#g-send"/></svg></button>
    </form>
  </div>
</template>

<!-- ============ MANUAL TEMPLATE ============ -->
<template id="tpl-manual">
  <header class="manual-head">
    <h2 class="manual-title">Your Manual</h2>
    <div class="manual-sub">Five layers · written in your words</div>
  </header>
  <div class="divider" aria-hidden="true"><svg><use href="#g-leaf-tiny"/></svg></div>

  <section class="bed" style="--i:0">
    <header class="bed-head">
      <span class="bed-glyph" aria-hidden="true"><svg><use href="#g-blossom"/></svg></span>
      <div><span class="bed-num">Layer I</span><h3 class="bed-name">My Strengths</h3></div>
      <span class="bed-count">2 entries</span>
    </header>
    <div class="entry open">
      <button type="button" class="entry-toggle" aria-expanded="true">
        <span class="entry-star" aria-label="Starred entry">&#10038;</span>
        <span class="entry-title">I build the whole thing in my head before I touch it</span>
        <svg class="entry-chev" aria-hidden="true"><use href="#g-chev"/></svg>
      </button>
      <div class="entry-body">Before you open a file or write a line, the structure assembles itself somewhere behind your eyes. From outside, the stillness reads as not working. The stillness is the work. By the time your hands move, most of the decisions are already made. It&rsquo;s why the work holds up under pressure that should have sunk it.</div>
    </div>
    <div class="entry">
      <button type="button" class="entry-toggle" aria-expanded="false">
        <span class="entry-title">I notice the thing everyone else walks past</span>
        <svg class="entry-chev" aria-hidden="true"><use href="#g-chev"/></svg>
      </button>
      <div class="entry-body"><em>This entry is still taking shape.</em></div>
    </div>
  </section>

  <section class="bed" style="--i:1">
    <header class="bed-head">
      <span class="bed-glyph" aria-hidden="true"><svg><use href="#g-rings"/></svg></span>
      <div><span class="bed-num">Layer II</span><h3 class="bed-name">Some of My Patterns</h3></div>
      <span class="bed-count">1 entry</span>
    </header>
    <div class="entry">
      <button type="button" class="entry-toggle" aria-expanded="false">
        <span class="entry-title">I say yes at the speed of the room</span>
        <svg class="entry-chev" aria-hidden="true"><use href="#g-chev"/></svg>
      </button>
      <div class="entry-body">In the moment, the answer people want to hear leaves your mouth before the calendar gets a vote. It isn&rsquo;t people-pleasing exactly. The room has a rhythm and you match it. The cost arrives later, addressed to a version of you who was never in the meeting.</div>
    </div>
  </section>

  <section class="bed bed--iii" style="--i:2">
    <header class="bed-head">
      <span class="bed-glyph" aria-hidden="true"><svg><use href="#g-root"/></svg></span>
      <div><span class="bed-num">Layer III</span><h3 class="bed-name">How I Process Things</h3></div>
      <span class="bed-count js-count3">0 entries</span>
    </header>
    <div class="bed-empty">Nothing planted here yet. Something is taking root in today&rsquo;s session.</div>
    <div class="entry entry--planted" hidden>
      <button type="button" class="entry-toggle" aria-expanded="false">
        <span class="entry-title">Deadlines aren&rsquo;t real until I can touch them</span>
        <span class="tag-new"><svg aria-hidden="true"><use href="#g-leaf-tiny"/></svg>Newly planted</span>
        <svg class="entry-chev" aria-hidden="true"><use href="#g-chev"/></svg>
      </button>
      <div class="entry-body">You commit to dates in a different timezone than the one you work in. In the meeting, Friday feels like plenty of room, so you say it freely. The date doesn&rsquo;t turn real until it&rsquo;s close enough to touch. Then the panic switches on, and the panic is the engine. It works. The deck is always good. What it costs is the stretch in between. The dread, the unopened file, the loop of telling yourself to start. The work was never the problem. The waiting room is.</div>
    </div>
  </section>

  <section class="bed" style="--i:3">
    <header class="bed-head">
      <span class="bed-glyph" aria-hidden="true"><svg><use href="#g-sun"/></svg></span>
      <div><span class="bed-num">Layer IV</span><h3 class="bed-name">What Helps</h3></div>
      <span class="bed-count">1 entry</span>
    </header>
    <div class="entry">
      <button type="button" class="entry-toggle" aria-expanded="false">
        <span class="entry-title">Another person in the room starts the engine early</span>
        <svg class="entry-chev" aria-hidden="true"><use href="#g-chev"/></svg>
      </button>
      <div class="entry-body">You can&rsquo;t start alone at two weeks out. You can start next to someone. It doesn&rsquo;t matter if they&rsquo;re working on something else entirely. Their presence makes the work real the way a deadline does, without the dread. The engine turns over early and quietly.</div>
    </div>
  </section>

  <section class="bed" style="--i:4">
    <header class="bed-head">
      <span class="bed-glyph" aria-hidden="true"><svg><use href="#g-branch"/></svg></span>
      <div><span class="bed-num">Layer V</span><h3 class="bed-name">How I Show Up with People</h3></div>
      <span class="bed-count">1 entry</span>
    </header>
    <div class="entry">
      <button type="button" class="entry-toggle" aria-expanded="false">
        <span class="entry-title">Quiet doesn&rsquo;t mean gone</span>
        <svg class="entry-chev" aria-hidden="true"><use href="#g-chev"/></svg>
      </button>
      <div class="entry-body">In a group your face goes still and your words go short. From outside it can read as checked out. It&rsquo;s the opposite. Everything is arriving at once and you&rsquo;re routing it. The people who know you well have learned that the quiet is where you do your part of the conversation.</div>
    </div>
  </section>
</template>

<script>
(function () {
  "use strict";
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* mount shared templates into both shells */
  ["session", "manual"].forEach(function (name) {
    var tpl = document.getElementById("tpl-" + name);
    $$('[data-mount="' + name + '"]').forEach(function (m) {
      m.appendChild(tpl.content.cloneNode(true));
    });
  });

  /* demo bar: desktop / phone */
  var stage = document.getElementById("stage");
  $$(".shell-toggle button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      stage.setAttribute("data-shell", btn.getAttribute("data-shell"));
      $$(".shell-toggle button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
    });
  });

  /* nav: Session / Manual in both shells */
  function closeMenus() {
    $$(".menu-pop").forEach(function (p) { p.hidden = true; });
    $$(".menu-btn").forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
  }
  $$(".js-shell").forEach(function (shell) {
    $$("[data-nav]", shell).forEach(function (btn) {
      btn.addEventListener("click", function () {
        var v = btn.getAttribute("data-nav");
        if (v === "settings") return; /* non-functional in this demo */
        shell.setAttribute("data-view", v);
        $$("[data-nav]", shell).forEach(function (b) {
          b.setAttribute("aria-current", String(b.getAttribute("data-nav") === v));
        });
        closeMenus();
      });
    });
  });

  /* phone menu */
  $$(".menu-btn").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var pop = btn.parentElement.querySelector(".menu-pop");
      var willOpen = pop.hidden;
      closeMenus();
      pop.hidden = !willOpen;
      btn.setAttribute("aria-expanded", String(willOpen));
    });
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".topbar")) closeMenus();
  });

  /* entry accordion */
  document.addEventListener("click", function (e) {
    var t = e.target.closest(".entry-toggle");
    if (!t) return;
    var entry = t.closest(".entry");
    var open = entry.classList.toggle("open");
    t.setAttribute("aria-expanded", String(open));
  });

  /* chat helpers */
  function scrollDown(stream) { stream.scrollTop = stream.scrollHeight; }
  function joveSays(stream, text, typingMs) {
    var wrap = document.createElement("div");
    wrap.className = "msg msg--jove msg-in";
    wrap.innerHTML =
      '<span class="who"><svg aria-hidden="true"><use href="#g-leaf-tiny"/></svg>Jove</span>' +
      '<div class="vessel typing" role="status" aria-label="Jove is writing">' +
      '<span class="seed"></span><span class="seed"></span><span class="seed"></span></div>';
    stream.appendChild(wrap);
    scrollDown(stream);
    window.setTimeout(function () {
      var v = wrap.querySelector(".vessel");
      v.classList.remove("typing");
      v.removeAttribute("role");
      v.removeAttribute("aria-label");
      v.textContent = text;
      scrollDown(stream);
    }, reduced ? 40 : typingMs);
  }

  /* send affordance */
  $$(".chatform").forEach(function (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var input = form.querySelector("input");
      var val = input.value.trim();
      if (!val) return;
      $$(".chat-stream").forEach(function (s) {
        var m = document.createElement("div");
        m.className = "msg msg--user msg-in";
        var v = document.createElement("div");
        v.className = "vessel";
        v.textContent = val;
        m.appendChild(v);
        s.appendChild(m);
        scrollDown(s);
      });
      $$(".chatform input").forEach(function (i) { i.value = ""; });
      window.setTimeout(function () {
        $$(".chat-stream").forEach(function (s) {
          joveSays(s, "Keep going. What happened right before that?", 1200);
        });
      }, reduced ? 40 : 450);
    });
  });

  /* checkpoint: Add to Manual → sprout draws → planted → Jove follows up */
  var confirmed = false;
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".js-confirm") || confirmed) return;
    confirmed = true;

    $$(".checkpoint").forEach(function (card) {
      $$(".cp-actions .btn", card).forEach(function (b) { b.disabled = true; });
      card.classList.add("is-planting");
    });
    $$(".chat-stream").forEach(scrollDown);

    var drawMs = reduced ? 60 : 1150;
    window.setTimeout(function () {
      $$(".checkpoint").forEach(function (c) { c.classList.add("is-planted"); });

      /* plant the entry in the Manual (both shells) */
      $$(".bed-empty").forEach(function (el) { el.hidden = true; });
      $$(".js-count3").forEach(function (el) { el.textContent = "1 entry"; });
      $$(".entry--planted").forEach(function (el) {
        el.hidden = false;
        el.classList.add("open", "is-new");
        var t = el.querySelector(".entry-toggle");
        if (t) t.setAttribute("aria-expanded", "true");
      });

      /* Jove returns to the conversation */
      window.setTimeout(function () {
        $$(".chat-stream").forEach(function (s) {
          joveSays(
            s,
            "That’s in your Manual now. You said the panic works. Where else does the engine only start when something is close enough to touch?",
            1300
          );
        });
      }, reduced ? 60 : 750);
    }, drawMs);
  });
})();
</script>
</body>
</html>
