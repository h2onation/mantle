    if (D['additions_' + m]) {
      const addText = 'ADDITIONAL VOICE GUIDANCE (' + PERSONA_LABELS[m] + ')' + D['additions_' + m];
      push('add_' + m, `Additional (${PERSONA_LABELS[m]})`, addText, 'tier-2', m);
    }
  });
  // Tier 3 conditional
  if (stage.state.isNew) push('firstMessage', 'First Message', D.firstMessage, 'tier-3');
  if (sel.convMode === 'guided') push('guidedIntake', 'Guided Intake', D.guidedIntake, 'tier-3');
  if (sel.convMode === 'upload') push('uploadMode', 'Upload Mode', D.uploadMode, 'tier-3');
  if (stage.state.isReturning) push('returningUser', 'Returning User', D.returningUser, 'tier-3');
  if (stage.state.isReturning || stage.state.isCheckpoint) push('checkpoints', 'Checkpoints', D.checkpoints, 'tier-3');
  // Tier 3 always-on
  push('adapting', 'Adapting + Short Answers', D.adapting, 'tier-3');
  push('clinical', 'Clinical Material', D.clinicalMaterial, 'tier-3');
  push('referral', 'Professional Referral', D.professionalReferral, 'tier-3');
  push('fabricated', 'Fabricated Content', D.fabricatedContent, 'tier-3');
  push('checkpointLang', 'Checkpoint Language', D.checkpointLanguage, 'tier-3');
  if (stage.state.isNew) push('firstSession', 'First Session', D.firstSession, 'tier-3');
  // Dynamic (estimated)
  if (stage.state.isReturning) {
    blocks.push({ id: 'manual', label: 'Manual Entries (compressed)', tokens: 220, tier: 'tier-dynamic' });
    blocks.push({ id: 'sessionCtx', label: 'Session Context', tokens: 60, tier: 'tier-dynamic' });
  }
  if (stage.state.isCheckpoint) {
    blocks.push({ id: 'extraction', label: 'Extraction Brief', tokens: 180, tier: 'tier-dynamic' });
  }
  return blocks;
}

function blockLabelFor(id) {
  const labels = {
    intro: 'Persona Intro', tier1: 'Constitutional Rules',
    firstMessage: 'First Message', guidedIntake: 'Guided Intake', uploadMode: 'Upload Mode',
    returningUser: 'Returning User', checkpoints: 'Checkpoints',
    adapting: 'Adapting + Short Answers', clinical: 'Clinical Material', referral: 'Professional Referral',
    fabricated: 'Fabricated Content', checkpointLang: 'Checkpoint Language', firstSession: 'First Session',
    manual: 'Manual Entries (compressed)', sessionCtx: 'Session Context', extraction: 'Extraction Brief'
  };
  if (labels[id]) return labels[id];
  if (id.startsWith('t2_')) return `Voice (${PERSONA_LABELS[id.slice(3)] || id})`;
  if (id.startsWith('add_')) return `Additional (${PERSONA_LABELS[id.slice(4)] || id})`;
  return id;
}

function togglePersonaInStage(stageNum, mode) {
  const cur = effectiveSelection(stageNum);
  let personas = [...cur.personas];
  if (mode === 'general') {
    personas = personas.includes('general') ? [] : ['general'];
  } else {
    personas = personas.filter(p => p !== 'general');
    if (personas.includes(mode)) {
      personas = personas.filter(p => p !== mode);
    } else {
      personas.push(mode);
    }
  }
  if (personas.length === 0) personas = ['autistic'];
  if (!STAGE_SELECTIONS[stageNum]) STAGE_SELECTIONS[stageNum] = {};
  STAGE_SELECTIONS[stageNum].personas = personas;
  STAGE_SELECTIONS[stageNum].touchedPersona = true;
  renderJourney();
}

function setConvModeInStage(stageNum, mode) {
  if (!STAGE_SELECTIONS[stageNum]) STAGE_SELECTIONS[stageNum] = {};
  STAGE_SELECTIONS[stageNum].convMode = mode;
  STAGE_SELECTIONS[stageNum].touchedConvMode = true;
  renderJourney();
}

function effectiveSelection(stageNum) {
  const stage = JOURNEY_STAGES.find(s => s.num === stageNum);
  const sel = STAGE_SELECTIONS[stageNum] || {};
  let personas, convMode;

  // Locked stages always inherit from previous
  // Unlocked stages inherit unless the user has explicitly touched them
  if (!stage.options.persona || !sel.touchedPersona) {
    if (stageNum > 1) {
      personas = effectiveSelection(stageNum - 1).personas;
    } else {
      personas = stage.defaults.personas;
    }
  } else {
    personas = sel.personas;
  }

  if (!stage.options.convMode || !sel.touchedConvMode) {
    if (stageNum > 1) {
      convMode = effectiveSelection(stageNum - 1).convMode;
    } else {
      convMode = stage.defaults.convMode;
    }
  } else {
    convMode = sel.convMode;
  }

  return { personas: [...personas], convMode };
}

function renderStageOptions(stage) {
  const sel = effectiveSelection(stage.num);
  const personas = sel.personas;
  const convMode = sel.convMode;

  let personaRow = '<div class="opt-row"><span class="opt-label">Persona</span>';
  ['autistic', 'audhd', 'dyslexic', 'general'].forEach(m => {
    const isActive = personas.includes(m);
    if (stage.options.persona) {
      personaRow += `<span class="opt-chip persona-${m} ${isActive ? 'active' : ''}" onclick="togglePersonaInStage(${stage.num}, '${m}')">${PERSONA_LABELS[m]}</span>`;
    } else if (isActive) {
      personaRow += `<span class="opt-chip persona-${m} active fixed">${PERSONA_LABELS[m]}</span>`;
    }
  });
  if (!stage.options.persona) {
    personaRow += '<span class="hint">Locked in at onboarding</span>';
  } else {
    personaRow += '<span class="hint">Multi-select: stack additional voices</span>';
  }
  personaRow += '</div>';

  let modeRow = '<div class="opt-row"><span class="opt-label">Conv mode</span>';
  ['standard', 'guided', 'upload'].forEach(m => {
    const isActive = convMode === m;
    const label = m === 'standard' ? 'Standard' : m === 'guided' ? 'Guided Intake' : 'Upload';
    if (stage.options.convMode) {
      modeRow += `<span class="opt-chip mode-chip ${isActive ? 'active' : ''}" onclick="setConvModeInStage(${stage.num}, '${m}')">${label}</span>`;
    } else if (isActive) {
      modeRow += `<span class="opt-chip mode-chip active fixed">${label}</span>`;
    }
  });
  if (!stage.options.convMode) {
    modeRow += '<span class="hint">Set at session start</span>';
  } else {
    modeRow += '<span class="hint">Click to switch — see blocks change</span>';
  }
  modeRow += '</div>';

  return `<div class="journey-options">${personaRow}${modeRow}</div>`;
}

function renderJourney() {
  let html = '';
  html += `<div class="overview-intro">
    <strong>A user moving through the product. At each stage, see what's in Jove's prompt — and what choices change it.</strong>
    Stages 1 and 3 have live option chips: click Persona or Conv Mode to see the prompt update. Stages 2 and 4 carry forward the previous choices (locked — those decisions were already made).
  </div>`;

  let prevIds = null;
  let prevTotal = null;
  JOURNEY_STAGES.forEach((stage) => {
    const blocks = getStageBlocks(stage.num);
    const ids = new Set(blocks.map(b => b.id));
    const total = blocks.reduce((s, b) => s + b.tokens, 0);

    const added = prevIds ? blocks.filter(b => !prevIds.has(b.id)).map(b => b.id) : [];
    const removed = prevIds ? [...prevIds].filter(id => !ids.has(id)) : [];
    const isFirst = prevIds === null;

    let changesHtml = '';
    if (!isFirst) {
      const parts = [];
      added.forEach(id => parts.push(`<span class="diff-pill added">+ ${blockLabelFor(id)}</span>`));
      removed.forEach(id => parts.push(`<span class="diff-pill removed">− ${blockLabelFor(id)}</span>`));
      changesHtml = `<div class="journey-changes">
        <span class="label">What changed:</span>
        ${parts.length > 0 ? parts.join('') : '<em style="color:#9a8f84">Same blocks as previous stage.</em>'}
      </div>`;
    }

    const blocksHtml = blocks.map(b => `
      <li class="${added.includes(b.id) ? 'added' : ''}">
        <span class="block-dot ${b.tier}"></span>
        <span class="name">${b.label}</span>
        <span class="tok">${fmt(b.tokens)}</span>
        ${added.includes(b.id) && !isFirst ? '<span class="new-tag">NEW</span>' : ''}
      </li>
    `).join('');

    let deltaHtml = '';
    if (prevTotal !== null) {
      const diff = total - prevTotal;
      const sign = diff > 0 ? '+' : '';
      const cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
      deltaHtml = `<span class="delta ${cls}">${sign}${fmt(diff)} vs previous</span>`;
    }

    html += `<div class="journey-stage">
      <div class="journey-num">${stage.num}</div>
      <div class="journey-header">
        <div>
          <div class="journey-title">${stage.title}</div>
          <div class="journey-subtitle">${stage.subtitle}</div>
        </div>
      </div>
      <div class="journey-scenario">${stage.scenario}</div>
      ${renderStageOptions(stage)}
      ${changesHtml}
      <ul class="journey-blocks">${blocksHtml}</ul>
      <div class="journey-total">
        <span>Total in prompt at this moment</span>
        <span><span class="num">~${fmt(total)} tokens</span> ${deltaHtml}</span>
      </div>
    </div>`;

    prevIds = ids;
    prevTotal = total;
  });

  document.getElementById('blocks').innerHTML = html;
}

function render() {
  const state = getState();
  let personas = state.personas;
  if (personas.length === 0) personas = ['autistic'];

  const primary = personas[0];
  const secondary = personas.slice(1).filter(p => p !== 'general');

  let html = '';

  // 1. Persona Intro (always)
  html += makeBlock('intro', 'tier-intro', '<span class="tier-tag">Intro</span>Persona Intro', D.intro, true);

  // 2. Tier 1 (always)
  html += makeBlock('tier1', 'tier-1', '<span class="tier-tag">Tier 1</span>Constitutional Rules', D.tier1, true);

  // 3. Tier 2 for primary persona
  const t2key = 'tier2_' + primary;
  const t2label = PERSONA_LABELS[primary] || primary;
  html += makeBlock('tier2', 'tier-2', '<span class="tier-tag">Tier 2</span>Voice (' + t2label + ')', D[t2key], true);

  // 4. Additional voice guidance for secondary modes
  for (const mode of secondary) {
    const addKey = 'additions_' + mode;
    if (D[addKey]) {
      const addLabel = PERSONA_LABELS[mode] || mode;
      const addText = 'ADDITIONAL VOICE GUIDANCE (' + addLabel + ')' + D[addKey];
      html += makeBlock('add_' + mode, 'tier-2', '<span class="tier-tag">Tier 2</span>Additional Voice (' + addLabel + ')', addText, true);
    }
  }

  // 5. Tier 3 conditional blocks
  // First Message
  html += makeBlock('firstMessage', 'tier-3', '<span class="tier-tag">Tier 3</span>First Message', D.firstMessage, state.isNew);

  // Guided Intake
  html += makeBlock('guidedIntake', 'tier-3', '<span class="tier-tag">Tier 3</span>Guided Intake', D.guidedIntake, state.convMode === 'guided');

  // Upload Mode
  html += makeBlock('uploadMode', 'tier-3', '<span class="tier-tag">Tier 3</span>Upload Mode', D.uploadMode, state.convMode === 'upload');

  // Returning User
  html += makeBlock('returningUser', 'tier-3', '<span class="tier-tag">Tier 3</span>Returning User', D.returningUser, state.isReturning);

  // Checkpoints
  html += makeBlock('checkpoints', 'tier-3', '<span class="tier-tag">Tier 3</span>Checkpoints', D.checkpoints, state.isReturning || state.isCheckpoint);

  // 6. Tier 3 always-on
  html += makeBlock('adapting', 'tier-3', '<span class="tier-tag">Tier 3</span>Adapting + Short Answers', D.adapting, true);
  html += makeBlock('clinical', 'tier-3', '<span class="tier-tag">Tier 3</span>Clinical Material', D.clinicalMaterial, true);
  html += makeBlock('referral', 'tier-3', '<span class="tier-tag">Tier 3</span>Professional Referral', D.professionalReferral, true);
  html += makeBlock('fabricated', 'tier-3', '<span class="tier-tag">Tier 3</span>Fabricated Content', D.fabricatedContent, true);
  html += makeBlock('checkpointLang', 'tier-3', '<span class="tier-tag">Tier 3</span>Checkpoint Language', D.checkpointLanguage, true);
  html += makeBlock('firstSession', 'tier-3', '<span class="tier-tag">Tier 3</span>First Session', D.firstSession, state.isNew);

  // 7. Dynamic context (placeholders)
  html += makeBlock('manual', 'tier-dynamic', '<span class="tier-tag">Dynamic</span>Manual Entries', '[Compressed manual entries would appear here based on confirmed entries]', true);

  const sessionCtx = 'SESSION CONTEXT\nThis is session 3.\nReturning user. Do NOT run the first-session entry.\nPrevious session: [summary]';
  html += makeBlock('sessionCtx', 'tier-dynamic', '<span class="tier-tag">Dynamic</span>Session Context', sessionCtx, state.isReturning);

  html += makeBlock('extraction', 'tier-dynamic', '<span class="tier-tag">Dynamic</span>Extraction Brief', '[Extraction context appended when checkpoint approaching]', true);

  document.getElementById('blocks').innerHTML = html;
  updateTotal();
}

function updateTotal() {
  let total = 0;
  document.querySelectorAll('.block:not(.hidden)').forEach(el => {
    total += parseInt(el.dataset.tokens || '0', 10);
  });
  document.getElementById('totalTokens').textContent = 'Total: ~' + fmt(total) + ' tokens';
}

// Persona checkbox logic
document.querySelectorAll('input[name="persona"]').forEach(cb => {
  cb.addEventListener('change', function() {
    if (this.value === 'general' && this.checked) {
      document.querySelectorAll('input[name="persona"]').forEach(x => {
        if (x.value !== 'general') x.checked = false;
      });
    } else if (this.checked) {
      const gen = document.querySelector('input[name="persona"][value="general"]');
      if (gen) gen.checked = false;
    }
    render();
  });
});

document.querySelectorAll('input[name="convMode"]').forEach(r => r.addEventListener('change', render));
document.getElementById('stateNew').addEventListener('change', render);
document.getElementById('stateReturning').addEventListener('change', render);
document.getElementById('stateCheckpoint').addEventListener('change', render);

render();
</script>
</body>
</html>
